<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening in T3 Code...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #1e1e1e;
      color: #a88bfa;
    }
    .container {
      text-align: center;
    }
    a {
      color: #a88bfa;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <p>Opening in T3 Code...</p>
    <p><a id="fallback" href="#">Tap here if it doesn't open automatically</a></p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = /^[0-9a-f-]{36}$/;
    const project = params.get('project');
    const thread = params.get('thread');
    if (id.test(project || '') && id.test(thread || '')) {
      const t3Url = 't3code://threads/' + project + '/' + thread;
      document.getElementById('fallback').href = t3Url;
      window.location = t3Url;
    } else {
      document.querySelector('.container').innerHTML = '<p>Missing parameters. Use ?project=...&thread=...</p>';
    }
  </script>
</body>
</html>
