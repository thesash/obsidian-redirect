<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Opening in Obsidian...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #1e1e1e;
      color: #a88bfa;
    }
    .container {
      text-align: center;
      padding: 0 1.5em;
    }
    .hint {
      color: #8a8a8a;
      font-size: 0.9em;
      max-width: 20em;
      margin: 2em auto 0;
    }
    a {
      color: #a88bfa;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <p>Opening in Obsidian...</p>
    <p><a id="fallback" href="#">Open it again</a></p>
    <p id="sync-hint" class="hint">If Obsidian says the note doesn't exist, it hasn't synced to this device yet.<br>Give Obsidian a few seconds, then open it again.</p>
  </div>
  <script>
    // The projects' docs vaults were combined into desk on 2026-09-30, each at its own folder:
    // vault=kitchen-docs&file=X now opens as vault=desk&file=kitchen-docs/X, so old links keep working.
    const MOVED_TO_DESK = ['kitchen-docs', 'artwork-docs', 'coyote-docs', 'foxy-docs', 'tracer-docs'];
    const query = new URLSearchParams(window.location.search);
    const vault = query.get('vault');
    // Their sessions moved to desk's own Sessions/ folder on 2026-10-01; two were renamed to stay unique.
    const RENAMED = {
      'artwork-docs/2026-09-27 Cross-product review': '2026-09-27 Artwork cross-product review',
      'coyote-docs/2026-09-27 Cross-product review': '2026-09-27 Coyote cross-product review',
    };
    if (MOVED_TO_DESK.includes(vault)) {
      let file = query.get('file') || '';
      const session = file.match(/^Sessions\/([^/]+)(.*)$/);
      if (session) {
        file = 'Sessions/' + (RENAMED[vault + '/' + session[1]] || session[1]) + session[2];
      } else {
        file = vault + '/' + file;
      }
      query.set('vault', 'desk');
      query.set('file', file);
    }
    // Vaults with the wait-for-sync plugin (plugin/ in this repo) enabled on every device. Its open-synced
    // action waits for a note that hasn't synced yet instead of reporting it missing.
    const WAITS_FOR_SYNC = [];
    const action = WAITS_FOR_SYNC.includes(query.get('vault')) ? 'open-synced' : 'open';
    if (action === 'open-synced') document.getElementById('sync-hint').remove();
    const params = query.toString().replace(/\+/g, '%20');
    if (params) {
      const obsidianUrl = 'obsidian://' + action + '?' + params;
      document.getElementById('fallback').href = obsidianUrl;
      window.location = obsidianUrl;
    } else {
      document.querySelector('.container').innerHTML = '<p>Missing parameters. Use ?vault=...&file=...</p>';
    }
  </script>
</body>
</html>
